<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>专题分类 | GokottaMaker</title>
    <meta name="description" content="按方向浏览 GokottaMaker 的模拟电子、STM32、ESP32 与开源项目内容。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20260505-1910" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/gokottamaker-icon.png" alt="" /><span>Gokotta<b>Maker</b></span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./category.html?category=analog">模拟电子</a>
          <a href="./category.html?category=stm32">STM32</a>
          <a href="./category.html?category=esp32">ESP32</a>
          <a href="./projects.html">开源项目</a>
        </nav>
        <div class="header-actions"><a class="admin-link" href="./admin/index.html">管理端</a></div>
      </div>
    </header>
    <main class="site-shell section-row" id="mainContent">
      <div class="section-heading">
        <h1 id="categoryTitle">专题分类</h1>
        <a href="./index.html">返回首页</a>
      </div>
      <div class="tutorial-grid" id="categoryList"></div>
    </main>
    <script src="./data/posts.js?v=20260505-1910"></script>
    <script src="./data/seed.js?v=20260505-1910"></script>
    <script src="./api/content.js?v=20260505-1910"></script>
    <script src="./data/content-store.js?v=20260505-1910"></script>
    <script src="./data/media.js?v=20260505-1910"></script>
    <script>
      const map = { analog: "模拟电子", stm32: "STM32", esp32: "ESP32", projects: "开源项目" };
      const descriptions = {
        analog: "整理运放、滤波器、ADC 前端、电源噪声、输入保护和测量调试相关内容，关注从电路指标到真实验证的工程过程。",
        stm32: "整理 STM32 ADC、DMA、定时器、通信接口、Bootloader 和调试实践，关注可复用的嵌入式工程方法。",
        esp32: "整理 ESP32 低功耗、Wi-Fi、MQTT、OTA、传感器节点和电池供电设计，关注联网设备的长期稳定运行。",
        projects: "记录 GokottaMaker 的开源硬件项目，包括 BOM、原理图、PCB、固件、外壳、调试记录和版本演进。"
      };
      const key = new URLSearchParams(location.search).get("category") || "analog";
      const category = map[key] || "模拟电子";
      const description = descriptions[key] || descriptions.analog;
      document.title = `${category} | GokottaMaker`;
      document.querySelector('meta[name="description"]').setAttribute("content", description);
      document.querySelector("#categoryTitle").textContent = category;
      const items = window.GokottaContent.getPosts().filter((post) => post.category === category);
      document.querySelector("#categoryList").innerHTML =
        items
          .map(
            (post) => `
              <article class="article-card">
                <a href="./post.html?id=${post.id}">${window.GokottaMedia.image(post.cover, `${post.title}封面`, { loading: "lazy" })}</a>
                <div>
                  <span class="category-pill">${post.category}</span>
                  <h3><a href="./post.html?id=${post.id}">${post.title}</a></h3>
                  <p>${post.excerpt}</p>
                  <div class="card-footer"><span>${post.readTime}</span><span>${post.date}</span></div>
                </div>
              </article>
            `
          )
          .join("") || "<div class=\"empty-state\">这个分类还没有文章。</div>";
    </script>
    <script src="./data/site-meta.js?v=20260505-1910"></script>
    <script src="./data/footer.js?v=20260505-1910"></script>
  </body>
</html>
