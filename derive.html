<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公式与推导 | LarkixMaker</title>
    <meta name="description" content="查看 LarkixMaker 的公开公式卡与变量推导节点。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo/larkix/rocket-bird-final/larkix-rocket-bird-final-icon.svg?v=transparent-20260524" />
    <link rel="stylesheet" href="./assets/vendor/katex/katex.min.css?v=0.16.22" />
    <link rel="stylesheet" href="./styles.css?v=20260814-0001" />
    <style>
      .formula-card-public-meta {
        display: grid;
        gap: 0;
        margin: 18px 0 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .formula-conclusion-public,
      .formula-purpose-public,
      .formula-markdown-derivation {
        margin-top: 22px;
      }

      .formula-conclusion-public > h2,
      .formula-purpose-public > h2,
      .formula-markdown-derivation > h2 {
        margin-bottom: 10px;
      }

      .formula-purpose-public > p,
      .formula-card-empty {
        margin: 0;
        color: var(--muted);
      }

      .formula-markdown-derivation > :last-child {
        margin-bottom: 0;
      }

      .formula-card-public-meta > div {
        display: grid;
        grid-template-columns: minmax(120px, 0.35fr) minmax(0, 1fr);
        gap: 16px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .formula-card-public-meta > div:last-child {
        border-bottom: 0;
      }

      .formula-card-public-meta dt {
        color: var(--muted);
        font-weight: 700;
      }

      .formula-card-public-meta dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .formula-derivation-public {
        margin-top: 28px;
      }

      .formula-derivation-public > p {
        color: var(--muted);
      }

      .formula-derivation-public-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .formula-derivation-public-grid > section {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .formula-derivation-public-grid h3 {
        margin-top: 0;
      }

      .formula-derivation-public-list {
        display: grid;
        gap: 10px;
      }

      .formula-derivation-link,
      .formula-derivation-empty {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        overflow-wrap: anywhere;
      }

      .formula-derivation-link {
        color: inherit;
        text-decoration: none;
      }

      .formula-derivation-link:hover {
        border-color: var(--accent);
      }

      .formula-derivation-link span,
      .formula-derivation-link code,
      .formula-derivation-empty {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .formula-derivation-link.is-unavailable {
        border-color: color-mix(in srgb, #d79b00 48%, var(--line));
        background: color-mix(in srgb, #fff3c4 62%, var(--card));
      }

      .formula-graph-public {
        margin: 0 0 26px;
        padding: 0 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .formula-graph-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }

      .formula-graph-heading h2,
      .formula-graph-heading p {
        margin: 0;
      }

      .formula-graph-heading p,
      .formula-graph-heading > span,
      .formula-graph-status {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .formula-graph-host {
        min-width: 0;
      }

      .formula-graph-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }

      .formula-graph-toolbar button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font: inherit;
        font-size: 1.15rem;
      }

      .formula-graph-toolbar button:hover,
      .formula-graph-toolbar button:focus-visible {
        border-color: var(--accent);
        outline: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
        outline-offset: 1px;
      }

      .formula-graph-canvas {
        position: relative;
        isolation: isolate;
        width: 100%;
        height: clamp(340px, 48vh, 520px);
        min-width: 0;
        overflow: hidden;
        border-block: 1px solid var(--line);
        background:
          linear-gradient(var(--surface), var(--surface)) padding-box,
          repeating-linear-gradient(0deg, transparent 0 23px, color-mix(in srgb, var(--line) 34%, transparent) 24px) border-box;
        cursor: grab;
        touch-action: none;
      }

      .formula-graph-canvas:active {
        cursor: grabbing;
      }

      .formula-graph-canvas:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .formula-graph-cytoscape,
      .formula-graph-node-layer {
        position: absolute;
        inset: 0;
      }

      .formula-graph-node-layer {
        z-index: 2;
        overflow: hidden;
        pointer-events: none;
      }

      .formula-graph-node-layer.is-measuring {
        overflow: visible;
      }

      .formula-graph-node {
        position: absolute;
        display: grid;
        width: max-content;
        min-width: 176px;
        max-width: none;
        gap: 8px;
        box-sizing: border-box;
        padding: 12px 14px;
        overflow: visible;
        border: 1.5px solid #7b8794;
        border-radius: 7px;
        color: #17202a;
        background: #f8fafc;
        box-shadow: 0 3px 10px color-mix(in srgb, #17202a 10%, transparent);
        cursor: grab;
        font: inherit;
        text-align: center;
        text-decoration: none;
        transform-origin: center;
        user-select: none;
        touch-action: none;
        pointer-events: auto;
      }

      button.formula-graph-node {
        appearance: none;
      }

      .formula-graph-node:active {
        cursor: grabbing;
      }

      .formula-graph-node:hover {
        border-color: #0b6bcb;
        color: #17202a;
      }

      .formula-graph-node:focus-visible,
      .formula-graph-node.is-selected {
        outline: 3px solid color-mix(in srgb, #0b6bcb 72%, transparent);
        outline-offset: 2px;
      }

      .formula-graph-node.is-current {
        border: 3px solid #b35c00;
        color: #4a2a00;
        background: #fff4cf;
        box-shadow: 0 5px 16px color-mix(in srgb, #b35c00 22%, transparent);
      }

      .formula-graph-node.is-article {
        min-width: 196px;
        border-color: #7c3aed;
        border-radius: 3px;
        color: #3b176a;
        background: #f5f3ff;
      }

      .formula-graph-node-kind {
        color: #64748b;
        font-size: 0.68rem;
        font-weight: 750;
      }

      .formula-graph-node.is-article .formula-graph-node-kind {
        color: #6d28d9;
      }

      .formula-graph-node-state {
        display: inline-block;
        margin-bottom: 0.16rem;
        color: #8a5d00;
        font-size: 0.66rem;
        font-weight: 750;
      }

      .formula-graph-node.is-archived .formula-graph-node-state {
        color: #64748b;
      }

      .formula-graph-node.is-draft {
        border-style: dashed;
        border-color: #8a5d00;
      }

      .formula-graph-node.is-archived {
        border-style: dotted;
        opacity: 0.62;
      }

      .formula-graph-node-title {
        display: block;
        max-width: 30ch;
        margin-inline: auto;
        overflow-wrap: anywhere;
        font-size: 0.78rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .formula-graph-node-math {
        display: block;
        width: max-content;
        max-width: none;
        margin-inline: auto;
        color: inherit;
        font-size: 1rem;
        line-height: 1.35;
        white-space: nowrap;
      }

      .formula-graph-node-math .katex-display {
        width: max-content;
        margin: 0;
      }

      .formula-graph-node-math.is-invalid {
        color: #8b1e1e;
        font-size: 0.84rem;
        white-space: normal;
      }

      .formula-graph-node-math.is-article-summary {
        width: auto;
        color: #6d28d9;
        font-size: 0.78rem;
        white-space: normal;
      }

      .formula-graph-node-layer.is-measuring .formula-graph-node {
        visibility: hidden;
        transform: none !important;
      }

      [data-theme="dark"] .formula-graph-node {
        border-color: var(--theme-dark-border-strong);
        color: var(--theme-dark-text);
        background: var(--theme-dark-surface-raised);
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.38);
      }

      [data-theme="dark"] .formula-graph-node:hover,
      [data-theme="dark"] .formula-graph-node:focus-visible,
      [data-theme="dark"] .formula-graph-node.is-selected {
        border-color: var(--theme-dark-focus);
        color: var(--theme-dark-text);
      }

      [data-theme="dark"] .formula-graph-node.is-current {
        border-color: #fbbf24;
        color: #fff7d6;
        background: color-mix(in srgb, #854d0e 52%, var(--theme-dark-surface-raised));
      }

      [data-theme="dark"] .formula-graph-node.is-article {
        border-color: #c4b5fd;
        color: #f5f3ff;
        background: #2e1751;
      }

      [data-theme="dark"] .formula-graph-node-math.is-invalid {
        color: var(--theme-dark-error);
      }

      .formula-graph-status {
        min-height: 1.35em;
        margin: 8px 0 0;
      }

      .formula-dependency-ref {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        gap: 8px;
        margin: 2px 0;
        padding: 5px 8px;
        border-left: 3px solid #0b6bcb;
        color: var(--ink);
        background: color-mix(in srgb, #eaf4ff 72%, var(--surface));
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .formula-dependency-ref:hover {
        color: #0757a6;
        background: color-mix(in srgb, #d9edff 78%, var(--surface));
      }

      .formula-dependency-ref.is-unavailable {
        border-left-color: #a46b00;
        color: var(--muted);
      }

      @media (max-width: 560px) {
        .formula-card-public-meta > div {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .formula-derivation-public-grid {
          grid-template-columns: 1fr;
        }

        .formula-graph-heading {
          align-items: start;
          flex-direction: column;
          gap: 6px;
        }

        .formula-graph-canvas {
          height: 360px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .formula-graph-node {
          scroll-behavior: auto;
        }
      }
    </style>
