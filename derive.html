    <style>
      .formula-card-public-meta {
        display: grid;
        gap: 0;
        margin: 18px 0 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .formula-conclusion-public,
      .formula-purpose-public,
      .formula-markdown-derivation {
        margin-top: 22px;
      }

      .formula-conclusion-public > h2,
      .formula-purpose-public > h2,
      .formula-markdown-derivation > h2 {
        margin-bottom: 10px;
      }

      .formula-purpose-public > p,
      .formula-card-empty {
        margin: 0;
        color: var(--muted);
      }

      .formula-markdown-derivation > :last-child {
        margin-bottom: 0;
      }

      .formula-card-public-meta > div {
        display: grid;
        grid-template-columns: minmax(120px, 0.35fr) minmax(0, 1fr);
        gap: 16px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .formula-card-public-meta > div:last-child {
        border-bottom: 0;
      }

      .formula-card-public-meta dt {
        color: var(--muted);
        font-weight: 700;
      }

      .formula-card-public-meta dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .formula-derivation-public {
        margin-top: 28px;
      }

      .formula-derivation-public > p {
        color: var(--muted);
      }

      .formula-derivation-public-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .formula-derivation-public-grid > section {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .formula-derivation-public-grid h3 {
        margin-top: 0;
      }

      .formula-derivation-public-list {
        display: grid;
        gap: 10px;
      }

      .formula-derivation-link,
      .formula-derivation-empty {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        overflow-wrap: anywhere;
      }

      .formula-derivation-link {
        color: inherit;
        text-decoration: none;
      }

      .formula-derivation-link:hover {
        border-color: var(--accent);
      }

      .formula-derivation-link span,
      .formula-derivation-link code,
      .formula-derivation-empty {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .formula-derivation-link.is-unavailable {
        border-color: color-mix(in srgb, #d79b00 48%, var(--line));
        background: color-mix(in srgb, #fff3c4 62%, var(--card));
      }

      .formula-graph-public {
        margin: 0 0 26px;
        padding: 0 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .formula-graph-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
      }

      .formula-graph-heading h2,
      .formula-graph-heading p {
        margin: 0;
      }

      .formula-graph-heading p,
      .formula-graph-heading > span,
      .formula-graph-status {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .formula-graph-host {
        min-width: 0;
      }

      .formula-graph-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }

      .formula-graph-toolbar button {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font: inherit;
        font-size: 1.15rem;
      }

      .formula-graph-toolbar button:hover,
      .formula-graph-toolbar button:focus-visible {
        border-color: var(--accent);
        outline: 2px solid color-mix(in srgb, var(--accent) 28%, transparent);
        outline-offset: 1px;
      }

      .formula-graph-canvas {
        width: 100%;
        height: clamp(340px, 48vh, 520px);
        min-width: 0;
        border-block: 1px solid var(--line);
        background:
          linear-gradient(var(--surface), var(--surface)) padding-box,
          repeating-linear-gradient(0deg, transparent 0 23px, color-mix(in srgb, var(--line) 34%, transparent) 24px) border-box;
        touch-action: none;
      }

      .formula-graph-status {
        min-height: 1.35em;
        margin: 8px 0 0;
      }

      .formula-dependency-ref {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        gap: 8px;
        margin: 2px 0;
        padding: 5px 8px;
        border-left: 3px solid #0b6bcb;
        color: var(--ink);
        background: color-mix(in srgb, #eaf4ff 72%, var(--surface));
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .formula-dependency-ref:hover {
        color: #0757a6;
        background: color-mix(in srgb, #d9edff 78%, var(--surface));
      }

      .formula-dependency-ref.is-unavailable {
        border-left-color: #a46b00;
        color: var(--muted);
      }

      @media (max-width: 560px) {
        .formula-card-public-meta > div {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .formula-derivation-public-grid {
          grid-template-columns: 1fr;
        }

        .formula-graph-heading {
          align-items: start;
          flex-direction: column;
          gap: 6px;
        }

        .formula-graph-canvas {
          height: 360px;
        }
      }
    </style>
  </head>
