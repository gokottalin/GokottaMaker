    <style>
      .formula-card-public-meta {
        display: grid;
        gap: 0;
        margin: 18px 0 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .formula-card-public-meta > div {
        display: grid;
        grid-template-columns: minmax(120px, 0.35fr) minmax(0, 1fr);
        gap: 16px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      .formula-card-public-meta > div:last-child {
        border-bottom: 0;
      }

      .formula-card-public-meta dt {
        color: var(--muted);
        font-weight: 700;
      }

      .formula-card-public-meta dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .formula-derivation-public {
        margin-top: 28px;
      }

      .formula-derivation-public > p {
        color: var(--muted);
      }

      .formula-derivation-public-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .formula-derivation-public-grid > section {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .formula-derivation-public-grid h3 {
        margin-top: 0;
      }

      .formula-derivation-public-list {
        display: grid;
        gap: 10px;
      }

      .formula-derivation-link,
      .formula-derivation-empty {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--card);
        overflow-wrap: anywhere;
      }

      .formula-derivation-link {
        color: inherit;
        text-decoration: none;
      }

      .formula-derivation-link:hover {
        border-color: var(--accent);
      }

      .formula-derivation-link span,
      .formula-derivation-link code,
      .formula-derivation-empty {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .formula-derivation-link.is-unavailable {
        border-color: color-mix(in srgb, #d79b00 48%, var(--line));
        background: color-mix(in srgb, #fff3c4 62%, var(--card));
      }

      @media (max-width: 560px) {
        .formula-card-public-meta > div {
          grid-template-columns: 1fr;
          gap: 4px;
        }

        .formula-derivation-public-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
