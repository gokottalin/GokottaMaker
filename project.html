<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目详情 | LarkixMaker</title>
    <meta name="description" content="查看 LarkixMaker 开源硬件项目的 Markdown 文档、进度与资料链接。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20260519-003" />
  </head>
  <body data-layout-page="projectDetailPage">
    <a class="skip-link" href="#projectContent">跳到正文</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/larkix/larkix-final-transparent-icon.svg" alt="" aria-hidden="true" /><span class="brand-wordmark">Larki<span>x</span></span><span class="brand-product">Maker</span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./category.html?category=analog">模拟电子</a>
          <a href="./category.html?category=stm32">STM32</a>
          <a href="./category.html?category=esp32">ESP32</a>
          <a href="./projects.html">开源项目</a>
          <a href="./miniapps.html">小程序</a>
        </nav>
        <div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换夜间模式" title="切换夜间模式"><span class="theme-toggle-icon" aria-hidden="true"></span></button><a class="return-link" href="./maker.html">返回首页</a></div>
      </div>
    </header>
    <main data-layout-container>
      <section class="site-shell post-hero" id="projectHero" data-layout-section="projectHero"></section>
      <section class="post-layout" data-layout-section="projectBody">
        <aside class="toc-card">
          <strong>项目目录</strong>
          <nav id="tocList" aria-label="项目目录"></nav>
        </aside>
        <article class="markdown-article" id="projectContent"></article>
      </section>
    </main>
    <script src="./data/posts.js?v=20260519-003"></script>
    <script src="./api/content.js?v=20260519-003"></script>
    <script src="./data/content-store.js?v=20260519-003"></script>
    <script src="./data/media.js?v=20260519-003"></script>
    <script src="./data/markdown-renderer.js?v=20260519-003"></script>
    <script src="./post.js?v=20260519-003"></script>
    <script>
      const publicProjects = window.LarkixContent.getProjects();
      const previewProjects = window.LarkixContent.getProjectDirectory();
      const projectMap = new Map(previewProjects.map((project) => [project.id, project]));
      publicProjects.forEach((project) => projectMap.set(project.id, project));

      window.renderMarkdownPage({
        collection: [...projectMap.values()],
        heroId: "projectHero",
        contentId: "projectContent",
        tocId: "tocList",
        blocked: (item) => item.statusKey !== "online",
        blockedMessage: "该项目尚未上线，访客暂时只能查看首页和项目列表中的概述。"
      });
    </script>
    <script src="./site-layout.js?v=20260519-003"></script>
    <script src="./data/site-meta.js?v=20260519-003"></script>
    <script src="./data/footer.js?v=20260519-003"></script>
  </body>
</html>
