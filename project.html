<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>项目详情 | GokottaMaker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/gokottamaker-icon.png" alt="" /><span>Gokotta<b>Maker</b></span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./category.html?category=analog">模拟电子</a>
          <a href="./category.html?category=stm32">STM32</a>
          <a href="./category.html?category=esp32">ESP32</a>
          <a href="./projects.html">开源项目</a>
        </nav>
        <div class="header-actions"><a class="admin-link" href="./admin/index.html">管理端</a></div>
      </div>
    </header>
    <main>
      <section class="site-shell post-hero" id="projectHero"></section>
      <section class="post-layout">
        <aside class="toc-card">
          <strong>项目目录</strong>
          <nav id="tocList" aria-label="项目目录"></nav>
        </aside>
        <article class="markdown-article" id="projectContent"></article>
      </section>
    </main>
    <script src="./data/posts.js"></script>
    <script src="./data/seed.js"></script>
    <script src="./api/content.js"></script>
    <script src="./data/content-store.js"></script>
    <script src="./data/markdown-renderer.js"></script>
    <script src="./post.js"></script>
    <script>
      window.renderMarkdownPage({
        collection: window.GokottaContent.getProjects(),
        heroId: "projectHero",
        contentId: "projectContent",
        tocId: "tocList",
        blocked: (item) => item.statusKey !== "online",
        blockedMessage: "该项目尚未上线，访客暂时只能查看首页和项目列表中的概述。"
      });
    </script>
    <script src="./data/site-meta.js"></script>
    <script src="./data/footer.js"></script>
  </body>
</html>
