<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小程序 | GokottaMaker</title>
    <meta name="description" content="GokottaMaker 小程序中心，集中管理在线电路、工具和后续可扩展的小应用。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20260509-1956" />
  </head>
  <body class="themed-page miniapp-page" data-page-theme="projects">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/gokottamaker-mark.svg" alt="GokottaMaker" /><span>Gokotta<b>Maker</b></span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./category.html?category=analog">模拟电子</a>
          <a href="./category.html?category=stm32">STM32</a>
          <a href="./category.html?category=esp32">ESP32</a>
          <a href="./projects.html">开源项目</a>
          <a href="./miniapps.html" aria-current="page">小程序</a>
        </nav>
        <div class="header-actions"><a class="admin-link" href="./admin/index.html">管理端</a></div>
      </div>
    </header>

    <main class="site-shell section-row" id="mainContent">
      <div class="section-heading miniapp-heading">
        <div class="section-title-block split-title">
          <div class="section-title-line">
            <h1>小程序中心</h1>
            <span>Mini Apps</span>
          </div>
          <p class="category-summary">集中呈现可直接使用的网页小程序。后续新增工具只需要登记到小程序清单，并保持独立页面、独立样式和独立 API 契约。</p>
        </div>
        <a class="return-link" href="./index.html">返回首页</a>
      </div>

      <section class="miniapp-registry" id="miniappRegistry" aria-label="小程序列表"></section>
    </main>

    <script src="./data/miniapps.js?v=20260509-1956"></script>
    <script>
      const miniapps = window.GOKOTTA_MINIAPPS || [];
      const safe = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[char]);
      document.querySelector("#miniappRegistry").innerHTML = miniapps
        .map((app) => `
          <article class="miniapp-card">
            <img class="miniapp-icon" src="${safe(app.icon)}" alt="" loading="lazy" />
            <div class="miniapp-card-body">
              <div class="miniapp-card-kicker">
                <span>${safe(app.category)}</span>
                <span>${safe(app.version)}</span>
              </div>
              <h2>${safe(app.title)}</h2>
              <p>${safe(app.summary)}</p>
              <div class="miniapp-capabilities">
                ${(app.capabilities || []).map((item) => `<span>${safe(item)}</span>`).join("")}
              </div>
              <div class="miniapp-card-footer">
                <span>${safe(app.status)}</span>
                <a class="card-link" href="${safe(app.href)}">打开工具</a>
              </div>
            </div>
          </article>
        `)
        .join("") || `<div class="empty-state">当前还没有可用小程序。</div>`;
    </script>
    <script src="./data/site-meta.js?v=20260509-1956"></script>
    <script src="./data/footer.js?v=20260509-1956"></script>
  </body>
</html>
