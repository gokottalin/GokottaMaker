<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD2File | LarkixMaker</title>
    <meta name="description" content="MD2File Markdown 文档转换入口。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/logo/larkix/rocket-bird-final/larkix-rocket-bird-final-icon.svg?v=transparent-20260524" />
    <link rel="stylesheet" href="./styles.css?v=20260814-0001" />
  </head>
  <body class="themed-page miniapp-page" data-page-theme="projects" data-layout-page="miniappsPage">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/larkix/rocket-bird-final/larkix-rocket-bird-final-icon.svg?v=transparent-20260524" alt="" aria-hidden="true" /><span class="brand-wordmark">Larki<span>x</span></span><span class="brand-product">Maker</span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./maker.html">首页</a>
          <a href="./category.html?category=electronics-basics">电子基础</a>
          <a href="./derive.html">公式推导</a>
          <a href="./projects.html">开源项目</a>
          <a href="./miniapps.html" aria-current="page">MD2File</a>
        </nav>
        <div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换夜间模式" title="切换夜间模式"><span class="theme-toggle-icon" aria-hidden="true"></span></button></div>
      </div>
    </header>

    <main class="site-shell section-row" id="mainContent" data-layout-container>
      <div class="section-heading miniapp-heading" data-layout-section="miniappsHeader">
        <div class="section-title-block split-title">
          <div class="section-title-line">
            <h1>MD2File</h1>
            <span>Markdown Converter</span>
          </div>
          <p class="category-summary">将 Markdown 转换为可下载的 Word 文档，并保留标题、列表、表格与公式。</p>
        </div>
        <a class="return-link" href="./maker.html">返回首页</a>
      </div>

      <section class="miniapp-registry" id="miniappRegistry" aria-label="小程序列表" data-layout-section="miniappRegistry"></section>
    </main>

    <script src="./data/miniapps.js?v=20260801-s39"></script>
    <script>
      const miniapps = Array.isArray(window.LARKIX_PUBLIC_MINIAPPS) ? window.LARKIX_PUBLIC_MINIAPPS : [];
      const safe = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" })[char]);
      document.querySelector("#miniappRegistry").innerHTML = miniapps
        .map((app) => `
          <article class="miniapp-card miniapp-card-${safe(app.id)}" data-public-miniapp-card="${safe(app.id)}">
            <img class="miniapp-icon miniapp-icon-${safe(app.id)}" src="${safe(app.icon)}" alt="" loading="lazy" />
            <div class="miniapp-card-body">
              <div class="miniapp-card-kicker">
                <span>${safe(app.category)}</span>
                <span>${safe(app.version)}</span>
              </div>
              <h2>${safe(app.title)}</h2>
              <p>${safe(app.summary)}</p>
              <div class="miniapp-card-footer">
                <a class="card-link" href="${safe(app.href)}">打开工具</a>
              </div>
            </div>
          </article>
        `)
        .join("") || `<div class="empty-state">当前还没有可用小程序。</div>`;
    </script>
    <script src="./site-layout.js?v=20260814-0001"></script>
    <script src="./data/site-meta.js?v=20260814-0001"></script>
    <script src="./data/footer.js?v=20260814-0001"></script>
  </body>
</html>
