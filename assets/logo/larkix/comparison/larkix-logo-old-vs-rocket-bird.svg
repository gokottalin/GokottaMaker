<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" fill="#F8FAFC"/>
  <style>
    .title { font: 850 40px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
    .sub { font: 600 18px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748B; }
    .h { font: 850 26px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
    .tag { font: 800 14px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
    .body { font: 650 16px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
    .small { font: 650 13px Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #64748B; }
    .score { font: 850 22px Inter, "Segoe UI", Arial, sans-serif; fill: #7C3AED; }
  </style>

  <text x="54" y="62" class="title">Larkix LOGO 新旧对比</text>
  <text x="54" y="94" class="sub">左：旧版白底飞鸟；右：新版火箭飞鸟。新版保留紫色飞鸟识别，同时强化速度感、科技感和标志完整度。</text>

  <g transform="translate(54 130)">
    <rect width="560" height="360" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="28" y="28" width="86" height="34" rx="17" fill="#F1F5F9"/>
    <text x="50" y="51" class="tag" fill="#64748B">旧版</text>
    <text x="132" y="53" class="h">白底飞鸟</text>
    <image href="../final-white-bg/larkix-final-white-bg-icon.svg" x="122" y="92" width="260" height="260"/>
  </g>

  <g transform="translate(666 130)">
    <rect width="560" height="360" rx="18" fill="#FFFFFF" stroke="#DDD6FE"/>
    <rect x="28" y="28" width="86" height="34" rx="17" fill="#F3E8FF"/>
    <text x="50" y="51" class="tag" fill="#7C3AED">新版</text>
    <text x="132" y="53" class="h">火箭飞鸟</text>
    <image href="../rocket-bird-final/larkix-rocket-bird-final-icon.svg" x="122" y="92" width="260" height="260"/>
  </g>

  <g transform="translate(54 526)">
    <rect width="1172" height="168" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g transform="translate(28 26)">
      <text x="0" y="0" class="small">对比维度</text>
      <text x="170" y="0" class="small">旧版表现</text>
      <text x="620" y="0" class="small">新版变化</text>

      <text x="0" y="42" class="score">01</text>
      <text x="52" y="42" class="body">轮廓</text>
      <text x="170" y="42" class="body">更像飞鸟/叶片，姿态柔和。</text>
      <text x="620" y="42" class="body">前端更锐，整体像飞鸟加火箭头，识别更强。</text>

      <text x="0" y="82" class="score">02</text>
      <text x="52" y="82" class="body">动势</text>
      <text x="170" y="82" class="body">偏平缓滑翔，速度感较弱。</text>
      <text x="620" y="82" class="body">上升角更明确，有发射和推进感。</text>

      <text x="0" y="122" class="score">03</text>
      <text x="52" y="122" class="body">结构</text>
      <text x="170" y="122" class="body">色面关系较像羽翼切面。</text>
      <text x="620" y="122" class="body">保留 4 个必要色面，减少装饰，标志更干净。</text>
    </g>
  </g>
</svg>
