<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Larkix Bird Wing Variants Contact Sheet</title>
  <desc id="desc">Five clearer Larkix logo variants focused on bird and wing recognition.</desc>
  <rect width="1280" height="900" fill="#F8FAFC"/>
  <path d="M0 0H1280V245H0V0Z" fill="#DBEAFE" opacity="0.66"/>
  <text x="72" y="92" fill="#0F172A" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="820" letter-spacing="0">Larkix Bird/Wing Variants</text>
  <text x="74" y="132" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Clearer bird head, beak, tail and open wings. The X is implied, not forced.</text>

  <g transform="translate(72 190)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">2A Dawn Bird</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Clearest full bird mark, recommended for main logo</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-birdwing-variant-1.svg"/>
  </g>

  <g transform="translate(668 190)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">2B Wide Wing</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Strongest wing expansion feeling</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-birdwing-variant-2.svg"/>
  </g>

  <g transform="translate(72 420)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">2C Feather Bird</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">More feather detail, still restrained</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-birdwing-variant-3.svg"/>
  </g>

  <g transform="translate(668 420)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">2D Monoline Bird</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Lighter navigation-oriented mark</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-birdwing-variant-4.svg"/>
  </g>

  <g transform="translate(72 650)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">2E Icon Bird</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Best for avatar, favicon and app icon</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-birdwing-variant-5.svg"/>
  </g>

  <g transform="translate(668 650)">
    <rect width="540" height="190" rx="8" fill="#07111F" stroke="#1E3A8A"/>
    <text x="28" y="44" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="820">Design Reset</text>
    <text x="28" y="76" fill="#A8B6C8" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="650">Bird and wing are now the first read. X remains a secondary hidden structure.</text>
    <g transform="translate(28 82)">
      <rect width="340" height="96" fill="#07111F"/>
      <rect x="8" y="8" width="80" height="80" rx="20" fill="#0F1B2D"/>
      <path d="M18.5 55.5C31.5 31.5 51.2 21.2 72.8 25.9C60.1 34.8 47.8 45.3 35.8 57.5C30 57.6 24.2 56.9 18.5 55.5Z" fill="#60A5FA"/>
      <path d="M27.2 70.6C43.8 64.2 59.9 52.7 75.4 36.1C71.8 57.8 53.5 74.2 30.5 79.5C29.1 76.7 28 73.8 27.2 70.6Z" fill="#38BDF8"/>
      <path d="M34.5 59.1C45.9 47.3 58 36.8 71 27.5" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M29.7 36.4C41.9 40.8 52.7 47.2 62 55.6" stroke="#1E3A8A" stroke-width="5.8" stroke-linecap="round"/>
      <circle cx="63.4" cy="29.5" r="5.5" fill="#60A5FA"/>
      <path d="M68.4 27.3L80.5 21.7L72.3 31.4Z" fill="#F59E0B"/>
      <path d="M21 60.2L11.8 66.4L25.2 67.2" fill="#1E3A8A"/>
      <text x="112" y="58" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="780" letter-spacing="0">Larki<tspan fill="#60A5FA" font-weight="860">x</tspan></text>
      <path d="M218 66C226 64.6 233 60.4 238.5 53.4" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
