<svg width="1280" height="900" viewBox="0 0 1280 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Larkix Wing or Head Variants Contact Sheet</title>
  <desc id="desc">Five Larkix logo options using only a bird wing or bird head, designed to avoid office collaboration logo language.</desc>
  <rect width="1280" height="900" fill="#F8FAFC"/>
  <path d="M0 0H1280V245H0V0Z" fill="#DBEAFE" opacity="0.66"/>
  <text x="72" y="92" fill="#0F172A" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="820" letter-spacing="0">Larkix Wing / Head Variants</text>
  <text x="74" y="132" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Only wing or head. No full bird body, no four-color office-suite icon language.</text>

  <g transform="translate(72 190)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">3A Single Dawn Wing</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Wing only, cleanest main-logo candidate</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-winghead-variant-1.svg"/>
  </g>

  <g transform="translate(668 190)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">3B Feather Stack</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Wing only, stronger feather read</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-winghead-variant-2.svg"/>
  </g>

  <g transform="translate(72 420)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">3C Wing Gate</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Wing only, steadier engineering feel</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-winghead-variant-3.svg"/>
  </g>

  <g transform="translate(668 420)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">3D Head Profile</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Head only, furthest from office-suite motifs</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-winghead-variant-4.svg"/>
  </g>

  <g transform="translate(72 650)">
    <rect width="540" height="190" rx="8" fill="#FFFFFF" stroke="#D9E4F1"/>
    <text x="28" y="42" fill="#2563EB" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="820">3E Minimal Head</text>
    <text x="28" y="70" fill="#64748B" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="650">Head only, compact icon potential</text>
    <image x="28" y="84" width="340" height="96" href="./larkix-winghead-variant-5.svg"/>
  </g>

  <g transform="translate(668 650)">
    <rect width="540" height="190" rx="8" fill="#07111F" stroke="#1E3A8A"/>
    <text x="28" y="44" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="820">Avoidance Notes</text>
    <text x="28" y="76" fill="#A8B6C8" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="650">No full bird, no rotating four-part mark, no multi-color collaboration suite signal.</text>
    <text x="28" y="116" fill="#F8FAFC" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="760">Recommended shortlist: 3A wing, 3D head.</text>
  </g>
</svg>
