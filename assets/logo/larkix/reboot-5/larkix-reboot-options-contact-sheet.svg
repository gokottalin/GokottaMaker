    <text x="28" y="70" class="note">更简洁轻盈，适合工具栏和极简风。</text>
    <image href="larkix-reboot-option-03.svg" x="30" y="92" width="118" height="118"/>
    <text x="168" y="162" class="word">Larki<tspan fill="#7C3AED">x</tspan></text>
  </g>

  <g transform="translate(257 440)">
    <rect width="360" height="250" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
