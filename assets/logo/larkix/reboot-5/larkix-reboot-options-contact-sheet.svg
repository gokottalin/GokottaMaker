    <text x="28" y="70" class="note">更适合头像、App icon、社媒标识。</text>
    <image href="larkix-reboot-option-02.svg" x="30" y="92" width="118" height="118"/>
    <text x="168" y="162" class="word">Larki<tspan fill="#7C3AED">x</tspan></text>
  </g>

  <g transform="translate(866 136)">
    <rect width="360" height="250" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="28" y="46" class="num">03</text>
