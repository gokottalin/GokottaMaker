    <path d="M39 44V57H51" stroke="#BFEFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29" cy="44" r="4.4" fill="#E0F7FF"/>
    <circle cx="50.5" cy="31.5" r="4.2" fill="#BFEFFF"/>
    <circle cx="51" cy="57" r="4.2" fill="#BFEFFF"/>
