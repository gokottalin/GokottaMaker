  <text x="94" y="43" fill="#0B1220" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="850" letter-spacing="0">Larkix</text>
  <text x="203" y="43" fill="#0D6FD3" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="850" letter-spacing="0">Maker</text>
