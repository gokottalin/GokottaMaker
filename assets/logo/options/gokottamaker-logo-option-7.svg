<svg width="320" height="88" viewBox="0 0 320 88" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LarkixMaker Logo Option 7</title>
  <desc id="desc">A blue rounded-square split circuit path with a forward arrow and open-source branch nodes.</desc>
  <defs>
    <linearGradient id="gm7-blue" x1="10" y1="10" x2="76" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8FF"/>
      <stop offset="0.5" stop-color="#0D6FD3"/>
      <stop offset="1" stop-color="#063C92"/>
    </linearGradient>
    <filter id="gm7-shadow" x="0" y="0" width="88" height="88" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0D6FD3" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#gm7-shadow)">
