<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GokottaMaker 管理端</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="stylesheet" href="../styles.css?v=20260506-0748" />
    <link rel="stylesheet" href="./admin.css?v=20260506-0748" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" id="loginPanel">
        <a class="brand admin-login-brand" href="../index.html">
          <img class="brand-symbol" src="../assets/logo/gokottamaker-icon.png" alt="" />
          <span>Gokotta<b>Maker</b></span>
        </a>
        <h1>管理端登录</h1>
        <form id="loginForm">
          <label>
            管理员账号
            <input name="username" autocomplete="username" required />
          </label>
          <label class="password-field">
            <span id="passwordLabel">管理员密码</span>
            <span class="password-control">
              <input name="password" type="password" autocomplete="current-password" aria-labelledby="passwordLabel" required />
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
            </span>
          </label>
          <button class="button primary" type="submit">登录</button>
        </form>
        <p class="notice" id="loginNotice"></p>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <aside class="admin-sidebar">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="收缩侧栏" aria-pressed="false">‹</button>
          <a class="brand" href="../index.html">
            <img class="brand-symbol" src="../assets/logo/gokottamaker-icon.png" alt="" />
            <span>Gokotta<b>Maker</b></span>
          </a>
          <nav class="admin-nav">
            <div class="nav-group">
              <span>内容工作台</span>
              <a href="#editor" data-short="编">内容编辑</a>
              <a href="#library" data-short="列">内容列表</a>
            </div>
            <div class="nav-group">
              <span>系统与访问</span>
              <a href="#health" data-short="状">系统状态</a>
              <a href="../index.html" data-short="首">访客首页</a>
            </div>
          </nav>
        </aside>

        <div class="admin-main">
          <header class="admin-topbar">
            <div>
              <p class="eyebrow">CMS</p>
              <h1>内容管理</h1>
            </div>
            <div class="admin-topbar-actions">
              <button class="button secondary" id="exportButton" type="button">导出内容</button>
              <button class="button secondary" id="logoutButton" type="button">退出</button>
            </div>
          </header>
          <p class="notice admin-notice" id="adminNotice" role="status" aria-live="polite"></p>

          <section class="editor-dock" id="editor">
            <button class="editor-dock-handle" id="editorDockHandle" type="button" aria-expanded="true">
              <span>内容编辑器</span>
              <strong id="editorDockState">展开</strong>
            </button>
            <div class="editor-dock-panel">
              <div class="editor-dock-toolbar">
                <div>
                  <p class="eyebrow">Editor</p>
                  <h2>内容编辑器</h2>
                </div>
                <button class="button secondary" id="editorDockToggle" type="button">收起</button>
              </div>
              <div class="editor-grid">
                <form class="editor-form" id="contentForm">
                  <div class="draft-status" id="draftStatus" hidden>
                    <strong>本地草稿未入库</strong>
                    <span id="draftStatusText">当前编辑内容已自动保存在此浏览器。</span>
                    <button class="button secondary" id="discardDraftButton" type="button">丢弃本地草稿</button>
                  </div>

              <div class="segmented" role="group" aria-label="内容类型">
                <label><input type="radio" name="type" value="post" checked />文章</label>
                <label><input type="radio" name="type" value="project" />项目</label>
              </div>

              <label>
                标题
                <input name="title" placeholder="例如：STM32 ADC + DMA 连续采样" required />
              </label>

              <label id="categoryField">
                分类
                <select name="category">
                  <option>模拟电子</option>
                  <option>STM32</option>
                  <option>ESP32</option>
                  <option>开源项目</option>
                </select>
              </label>

              <label id="statusField" hidden>
                项目状态
                <select name="statusKey">
                  <option value="planned">规划中</option>
                  <option value="development">开发中</option>
                  <option value="online">已上线</option>
                </select>
              </label>

              <label>
                摘要
                <textarea name="excerpt" rows="4" placeholder="这段内容会显示在首页卡片和详情页顶部。"></textarea>
              </label>

              <label>
                标签
                <input name="tags" placeholder="用逗号分隔，例如 ADC, DMA, 滤波" />
              </label>

              <label>
                发布状态
                <select name="publishStatus">
                  <option value="draft">草稿</option>
                  <option value="published">已发布</option>
                </select>
              </label>

              <div class="inline-fields">
                <label class="checkbox-field">
                  <input name="featured" type="checkbox" />
                  加入首页轮播
                </label>
                <label>
                  轮播排序
                  <input name="featuredOrder" type="number" min="0" step="1" value="0" />
                </label>
              </div>

              <div class="project-extra" id="projectExtra" hidden>
                <label>
                  项目版本
                  <input name="version" placeholder="例如：v0.1" />
                </label>
                <label>
                  项目进度
                  <input name="progress" type="number" min="0" max="100" step="1" value="0" />
                </label>
                <label>
                  GitHub / Gitee 链接
                  <input name="repoUrl" type="url" placeholder="https://..." />
                </label>
                <label>
                  BOM 链接
                  <input name="bomUrl" type="url" placeholder="https://..." />
                </label>
                <label>
                  文档链接
                  <input name="docsUrl" type="url" placeholder="https://..." />
                </label>
              </div>

              <label class="cover-picker" title="推荐图片格式：JPG、PNG、WebP；推荐比例 16:9；推荐分辨率 1600x900 或 1920x1080。">
                封面图片
                <input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
                <span class="file-hint" id="coverHint">从资源管理器选择图片，推荐 1600x900 或 1920x1080</span>
                <img class="cover-preview" id="coverPreview" alt="封面预览" />
              </label>

              <section class="image-library-panel">
                <div class="section-heading compact">
                  <h3>图片库</h3>
                  <button class="button secondary" id="refreshImagesButton" type="button">刷新图片库</button>
                </div>
                <div id="imageLibrary" class="image-library"></div>
              </section>

              <label>
                Markdown 文件导入
                <input id="markdownFile" type="file" accept=".md,text/markdown,text/plain" />
              </label>

              <label>
                Markdown 正文
                <textarea name="markdown" rows="14" placeholder="# 标题&#10;&#10;这里输入 Markdown 内容。"></textarea>
              </label>

                  <div class="form-actions editor-floating-actions">
                    <button class="button primary" type="submit">保存内容</button>
                    <button class="button secondary" id="resetButton" type="button">新建空白</button>
                  </div>
                </form>

                <article class="preview-panel">
                  <div class="preview-toolbar">
                    <p class="eyebrow">Preview</p>
                    <span>网页预览</span>
                  </div>
                  <div id="markdownPreview" class="markdown-preview markdown-article"></div>
                </article>
              </div>
            </div>
          </section>

          <section id="library" class="library-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Library</p>
                <h2>当前网站内容</h2>
              </div>
              <p class="library-note">这里显示主页出现的所有文章和项目。</p>
            </div>
            <div class="library-tools" aria-label="内容筛选">
              <label>
                搜索
                <input id="contentSearch" type="search" placeholder="搜索标题、摘要、标签、分类" />
              </label>
              <label>
                类型
                <select id="typeFilter">
                  <option value="all">全部</option>
                  <option value="post">文章</option>
                  <option value="project">项目</option>
                </select>
              </label>
              <label>
                状态
                <select id="statusFilter">
                  <option value="all">全部</option>
                  <option value="published">已发布</option>
                  <option value="draft">草稿</option>
                  <option value="deleted">回收站</option>
                  <option value="featured">首页轮播</option>
                </select>
              </label>
              <button class="button secondary" id="clearFiltersButton" type="button">清空筛选</button>
            </div>
            <div class="bulk-actions" id="bulkActions">
              <label class="checkbox-field bulk-select-all">
                <input id="selectAllContent" type="checkbox" />
                选择当前结果
              </label>
              <span id="contentResultCount">0 项内容</span>
              <span id="selectedCount">已选择 0 项</span>
              <button class="button secondary" id="bulkPublishButton" type="button">批量发布</button>
              <button class="button secondary" id="bulkDraftButton" type="button">批量转草稿</button>
              <button class="button secondary" id="bulkDeleteButton" type="button">批量回收</button>
              <button class="button secondary" id="bulkRestoreButton" type="button">批量恢复</button>
            </div>
            <div id="adminContentList" class="admin-article-list"></div>
          </section>

          <section id="health" class="library-panel health-panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">Health</p>
                <h2>系统状态</h2>
              </div>
              <button class="button secondary" id="refreshHealthButton" type="button">刷新状态</button>
            </div>
            <div id="healthPanel" class="health-grid">
              <div class="empty-state">登录后会显示服务、数据库、上传目录和备份状态。</div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="../data/posts.js?v=20260506-0748"></script>
    <script src="../data/seed.js?v=20260506-0748"></script>
    <script src="../api/content.js?v=20260506-0748"></script>
    <script src="../data/content-store.js?v=20260506-0748"></script>
    <script src="../data/markdown-renderer.js?v=20260506-0748"></script>
    <script src="./admin.js?v=20260506-0748"></script>
    <script src="../data/site-meta.js?v=20260506-0748"></script>
    <script src="../data/footer.js?v=20260506-0748"></script>
  </body>
</html>
