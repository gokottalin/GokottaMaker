server {
  listen 80;
  listen [::]:80;
  server_name www.larkix.com larkix.com;

  return 301 https://larkix.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name larkix.com www.larkix.com;

  # Keep certificate paths in the host configuration; never store private keys here.
  ssl_certificate /etc/nginx/ssl/larkix.com/fullchain.crt;
  ssl_certificate_key /etc/nginx/ssl/larkix.com/private.key;

  client_max_body_size 25m;

  # High-entropy private CMS namespace. The real value remains in the service
  # environment. Disable access logging and caching for every matching request.
  location ~ "^/[A-Za-z0-9_-]{48,128}(?:/|$)" {
    access_log off;
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_cache off;
    add_header Referrer-Policy "no-referrer" always;
  }

  location ~* "^/(?![A-Za-z0-9_-]{48,128}/).*\.(css|js|png|jpg|jpeg|webp|gif)$" {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 7d;
    expires 7d;
    add_header Cache-Control "public";
  }
}
