<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开源项目 | LarkixMaker</title>
    <meta name="description" content="浏览 LarkixMaker 的开源硬件项目、规划项目与已上线项目。" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20260519-003" />
  </head>
  <body class="themed-page" data-page-theme="projects" data-layout-page="projectsPage">
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html"><img class="brand-symbol" src="./assets/logo/larkix/larkix-final-transparent-icon.svg" alt="" aria-hidden="true" /><span class="brand-wordmark">Larki<span>x</span></span><span class="brand-product">Maker</span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="./category.html?category=analog">模拟电子</a>
          <a href="./category.html?category=stm32">STM32</a>
          <a href="./category.html?category=esp32">ESP32</a>
          <a href="./projects.html">开源项目</a>
          <a href="./miniapps.html">小程序</a>
        </nav>
        <div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换夜间模式" title="切换夜间模式"><span class="theme-toggle-icon" aria-hidden="true"></span></button><a class="admin-link" href="./admin/index.html">管理端</a></div>
      </div>
    </header>
    <main class="site-shell section-row" id="mainContent" data-layout-container>
      <div class="section-heading" data-layout-section="projectsHeader">
        <div class="section-title-block split-title">
          <div class="section-title-line">
            <h1>独立开源项目</h1>
            <span>Open Hardware Projects</span>
          </div>
          <p class="category-summary project-summary">从项目规划到硬件开源，沉淀原理图、PCB、BOM、固件、外壳与调试记录，让每个作品都可以复现与迭代。</p>
        </div>
        <a class="return-link" href="./maker.html">返回首页</a>
      </div>
      <div class="project-grid" id="projectList" data-layout-section="projectList"></div>
    </main>
    <script src="./data/posts.js?v=20260519-003"></script>
    <script src="./api/content.js?v=20260519-003"></script>
    <script src="./data/content-store.js?v=20260519-003"></script>
    <script src="./data/media.js?v=20260519-003"></script>
    <script>
      const escapeHtml = window.LarkixMedia.escapeHtml;
      const projectUrl = (project) => `./project.html?id=${encodeURIComponent(project.id)}`;
      document.querySelector("#projectList").innerHTML = window.LarkixContent.getProjectDirectory()
        .map((project) => {
          const online = project.statusKey === "online";
          const title = online ? `<a href="${projectUrl(project)}">${escapeHtml(project.title)}</a>` : escapeHtml(project.title);
          const action = online ? `<a class="card-link" href="${projectUrl(project)}">查看详情</a>` : "";
          return `
            <article class="project-card ${online ? "" : "is-planned"}">
              ${window.LarkixMedia.image(project.cover, `${project.title}项目图片`, { loading: "lazy", sizes: "(max-width: 760px) 100vw, 160px" })}
              <div>
                <span class="status">${escapeHtml(project.status)}</span>
                <h3>${title}</h3>
                <p>${escapeHtml(project.summary)}</p>
                <div class="card-footer"><span>${escapeHtml(project.license)}</span><span>★ ${escapeHtml(project.stars)}</span>${action}</div>
              </div>
            </article>
          `;
        })
        .join("");
    </script>
    <script src="./site-layout.js?v=20260519-003"></script>
    <script src="./data/site-meta.js?v=20260519-003"></script>
    <script src="./data/footer.js?v=20260519-003"></script>
  </body>
</html>
