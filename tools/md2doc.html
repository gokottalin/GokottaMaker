<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD2File Markdown 转换器 | LarkixMaker</title>
    <meta name="description" content="把 Markdown 转换为可下载文件，当前支持 Word DOCX，后续可扩展 PDF。" />
    <link rel="manifest" href="../site.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="../assets/logo/larkix/rocket-bird-final/larkix-rocket-bird-final-icon.svg?v=transparent-20260524" />
    <link rel="stylesheet" href="../styles.css?v=20260726-1650" />
    <link rel="stylesheet" href="../styles/md2doc.css?v=20260726-1650" />
  </head>
  <body class="md2doc-page">
    <a class="skip-link" href="#mainContent">跳到工具</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="../index.html"><img class="brand-symbol" src="../assets/logo/larkix/rocket-bird-final/larkix-rocket-bird-final-icon.svg?v=transparent-20260524" alt="" aria-hidden="true" /><span class="brand-wordmark">Larki<span>x</span></span><span class="brand-product">Maker</span></a>
        <nav class="main-nav" aria-label="主导航">
          <a href="../category.html?category=analog">模拟电子</a>
          <a href="../category.html?category=stm32">STM32</a>
          <a href="../category.html?category=esp32">ESP32</a>
          <a href="../projects.html">开源项目</a>
          <a href="../miniapps.html" aria-current="page">小程序</a>
        </nav>
        <div class="header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="切换夜间模式" title="切换夜间模式"><span class="theme-toggle-icon" aria-hidden="true"></span></button><a class="return-link" href="../miniapps.html">小程序中心</a></div>
      </div>
    </header>

    <main class="md2doc-shell" id="mainContent">
      <header class="md2doc-header">
        <img class="md2doc-icon" src="../assets/logo/md2file/md2file-miniapp-icon.svg?v=20260726-1650" alt="MD2File" />
        <div>
          <h1>MD2File Markdown 转换器</h1>
          <p>Markdown 输入、HTML 预览、当前导出 DOCX，后续可扩展 PDF。</p>
        </div>
        <div class="md2doc-header-actions">
          <button id="sampleButton" type="button">示例</button>
          <button id="importButton" type="button">导入 .md</button>
          <button id="downloadButton" type="button">下载 DOCX</button>
          <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden />
        </div>
      </header>

      <section class="md2doc-meta" aria-label="文档设置">
        <label>
          <span>文档标题</span>
          <input id="docTitle" type="text" value="LarkixMaker Markdown 文档" />
        </label>
        <label>
          <span>文件名</span>
          <input id="fileName" type="text" value="larkix-md2file" />
        </label>
        <label>
          <span>页面规格</span>
          <select id="pageSize">
            <option value="a4" selected>A4 210x297</option>
            <option value="letter">Letter 8.5x11</option>
            <option value="a5">A5 148x210</option>
          </select>
        </label>
        <label>
          <span>页边距</span>
          <select id="pageMargin">
            <option value="normal" selected>标准</option>
            <option value="narrow">窄</option>
            <option value="wide">宽</option>
          </select>
        </label>
        <label>
          <span>行距</span>
          <select id="lineSpacing">
            <option value="compact">紧凑</option>
            <option value="normal">常规</option>
            <option value="relaxed" selected>舒展</option>
            <option value="loose">宽松</option>
          </select>
        </label>
        <label>
          <span>预览缩放</span>
          <select id="previewZoom">
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
          </select>
        </label>
        <div class="md2doc-stat" id="docStats">0 字符</div>
      </section>

      <section class="md2doc-workspace" aria-label="Markdown 多格式转换工作台">
        <section class="md2doc-panel">
          <div class="md2doc-panel-head">
            <h2>Markdown</h2>
            <div class="md2doc-actions">
              <button id="copyButton" type="button">复制</button>
              <button id="clearButton" type="button">清空</button>
            </div>
          </div>
          <textarea id="markdownInput" spellcheck="false"></textarea>
        </section>

        <section class="md2doc-panel">
          <div class="md2doc-panel-head">
            <h2>预览</h2>
            <div class="md2doc-actions">
              <button id="syncScrollToggle" class="is-active" type="button" aria-pressed="true">同步滚动</button>
              <button id="alignScrollButton" type="button">对齐当前位置</button>
              <button id="refreshButton" type="button">刷新</button>
            </div>
          </div>
          <div class="md2doc-preview-stage" id="previewStage">
            <article class="md2doc-preview markdown-article" id="previewPane"></article>
          </div>
        </section>
      </section>

      <pre class="md2doc-log" id="diagnosticsLog">等待转换。</pre>
    </main>

    <script src="../data/markdown-renderer.js?v=20260726-1650"></script>
    <script src="./md2doc.js?v=20260726-1650"></script>
    <script src="../data/site-meta.js?v=20260726-1650"></script>
    <script src="../data/footer.js?v=20260726-1650"></script>
  </body>
</html>
